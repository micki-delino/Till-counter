<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Till Counter</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;color:#111}.wrap{max-width:540px;margin:auto;padding:14px}h1{text-align:center}.card{background:white;border-radius:14px;padding:14px;margin:12px 0}.row{display:grid;grid-template-columns:110px 1fr 90px;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #eee}label{font-weight:bold}input{width:100%;min-width:0;padding:10px 6px;font-size:18px;text-align:center;border:1px solid #bbb;border-radius:9px}.sub{text-align:right;font-weight:bold;color:#08732d}.total{display:flex;justify-content:space-between;align-items:center;font-size:23px;font-weight:bold}.total output{font-size:29px;color:#08732d}.field{display:grid;grid-template-columns:125px 1fr;align-items:center;gap:10px;margin:10px 0}.field input{text-align:right}.result{display:flex;justify-content:space-between;font-size:20px;font-weight:bold;border-top:1px solid #ddd;padding-top:14px;margin-top:14px}.result output{color:#08732d}button{width:100%;background:#d71920;color:white;border:0;border-radius:10px;font-size:20px;font-weight:bold;padding:15px;margin-top:20px}.hint{font-size:12px;color:#666;text-align:center}
</style></head><body><main class="wrap"><h1>Till Counter</h1><section class="card"><div class="row"><b>Item</b><b>Qty / Amount</b><b>Total</b></div><div id="rows"></div></section><section class="card"><div class="total"><span>TOTAL TILL</span><output id="till">$0.00</output></div><hr><div class="field"><label for="card">Card Total</label><input id="card" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div><div class="field"><label for="eftpos">EFTPOS</label><input id="eftpos" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div><div class="field"><label for="amex">Amex</label><input id="amex" type="number" inputmode="decimal" step="0.01" placeholder="0.00"></div><div class="result"><span>Card Total Result</span><output id="cardresult">$0.00</output></div><p class="hint">Card Total + EFTPOS − Amex. Separate from Total Till.</p><button id="reset">RESET ALL</button><p class="hint">Clears all quantities and amounts to zero.</p></section></main><script>
const items=[['5c',5],['10c',10],['20c',20],['50c',50],['$1',100],['$2',200],['$5',500],['$10',1000],['$20',2000],['$50',5000],['$100',10000],['Loose Coin Total',null]];
const fmt=n=>'$'+(n/100).toFixed(2);const rows=document.getElementById('rows');
items.forEach(([label,cents])=>{const row=document.createElement('div');row.className='row';const name=document.createElement('label');name.textContent=label;const input=document.createElement('input');input.type='number';input.inputMode=cents===null?'decimal':'numeric';input.step=cents===null?'0.01':'1';input.min='0';input.placeholder=cents===null?'0.00':'0';input.dataset.cents=cents===null?'loose':cents;const subtotal=document.createElement('output');subtotal.className='sub';subtotal.textContent='$0.00';row.append(name,input,subtotal);rows.append(row)});
const cents=id=>Math.round((Number(document.getElementById(id).value)||0)*100);
function calculate(){let total=0;document.querySelectorAll('#rows .row').forEach(row=>{const input=row.querySelector('input');const val=Number(input.value)||0;const sub=input.dataset.cents==='loose'?Math.round(val*100):val*Number(input.dataset.cents);total+=sub;row.querySelector('output').textContent=fmt(sub)});document.getElementById('till').textContent=fmt(total);document.getElementById('cardresult').textContent=fmt(cents('card')+cents('eftpos')-cents('amex'))}
document.querySelectorAll('input').forEach(input=>input.addEventListener('input',calculate));document.getElementById('reset').addEventListener('click',()=>{document.querySelectorAll('input').forEach(input=>input.value='');calculate()});calculate();
</script></body></html>
