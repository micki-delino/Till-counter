<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#14283b"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="application-name" content="Till Counter"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Till Counter</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color-scheme:dark;background:#101c2b;color:#f7f9fc}*{box-sizing:border-box}body{margin:0;padding:18px 14px 35px;max-width:650px;margin-inline:auto}h1{font-size:1.6rem;margin:4px 0 5px}p{margin:0 0 18px;color:#adbac8;font-size:.9rem}.line{display:grid;grid-template-columns:1fr 100px 105px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid #293a4b}.line label{font-weight:600}.line input{width:100%;background:#203348;color:white;border:1px solid #526479;border-radius:8px;padding:12px 8px;font-size:16px;text-align:right}.money{text-align:right;font-variant-numeric:tabular-nums;font-weight:650}.total{background:#1d3c50;border-radius:12px;margin:18px 0;padding:18px;display:flex;justify-content:space-between;align-items:center;font-size:1.2rem;font-weight:750}.total span:last-child{font-variant-numeric:tabular-nums}.section{margin-top:25px;font-weight:700;font-size:1.15rem}.sub{font-size:.85rem;color:#b2c3d0;margin:5px 0 10px}.cardline{grid-template-columns:1fr 145px}.cardresult{background:#203348}button{background:#e15e59;color:#fff;border:0;border-radius:12px;width:100%;padding:16px;font-size:1.05rem;font-weight:750;margin-top:15px;cursor:pointer}.header{display:grid;grid-template-columns:1fr 100px 105px;color:#8ca0b4;font-size:.76rem;text-align:right;padding-bottom:4px}.header span:first-child{text-align:left}@media(max-width:360px){.line{grid-template-columns:1fr 85px 88px;gap:5px}.line input{padding:10px 5px}}</style></head><body><h1>💵 Till Counter</h1><p>Australian cash count · calculated on this device</p><div class="header"><span>Denomination</span><span>Quantity</span><span>Subtotal</span></div><div id="cash"></div><div class="line"><label for="loose">Loose Coin Total</label><input id="loose" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0.00" aria-label="Loose coin amount"><span class="money" id="looseDisplay">$0.00</span></div><div class="total"><span>TOTAL TILL</span><span id="tillTotal">$0.00</span></div><div class="section">Card reconciliation</div><div class="sub">Separate from Total Till</div><div class="line cardline"><label for="card">Card Total</label><input id="card" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="line cardline"><label for="eftpos">EFTPOS</label><input id="eftpos" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="line cardline"><label for="amex">Amex</label><input id="amex" inputmode="decimal" type="number" min="0" step="0.01" placeholder="0.00"></div><div class="total cardresult"><span>Card + EFTPOS − Amex</span><span id="cardTotal">$0.00</span></div><button id="reset">RESET ALL</button><script>const denominations=[['5c',.05],['10c',.1],['20c',.2],['50c',.5],['$1',1],['$2',2],['$5',5],['$10',10],['$20',20],['$50',50],['$100',100]];const cash=document.getElementById('cash');const fmt=v=>new Intl.NumberFormat('en-AU',{style:'currency',currency:'AUD'}).format(v);const safe=v=>{const n=Number(v);return Number.isFinite(n)&&n>0?n:0};denominations.forEach(([name,value],i)=>{const line=document.createElement('div');line.className='line';const label=document.createElement('label');label.htmlFor='q'+i;label.textContent=name;const input=document.createElement('input');input.id='q'+i;input.type='number';input.inputMode='numeric';input.min='0';input.step='1';input.placeholder='0';input.dataset.value=value;const sum=document.createElement('span');sum.className='money';sum.id='s'+i;sum.textContent='$0.00';line.append(label,input,sum);cash.append(line)});function update(){let total=0;cash.querySelectorAll('input').forEach((input,i)=>{const amount=Math.floor(safe(input.value))*Number(input.dataset.value);total+=amount;document.getElementById('s'+i).textContent=fmt(amount)});const loose=safe(document.getElementById('loose').value);document.getElementById('looseDisplay').textContent=fmt(loose);document.getElementById('tillTotal').textContent=fmt(total+loose);document.getElementById('cardTotal').textContent=fmt(safe(document.getElementById('card').value)+safe(document.getElementById('eftpos').value)-safe(document.getElementById('amex').value))}document.querySelectorAll('input').forEach(el=>el.addEventListener('input',update));document.getElementById('reset').addEventListener('click',()=>{if(!confirm('Clear all till and card amounts?'))return;document.querySelectorAll('input').forEach(el=>el.value='');update()});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));update();</script></body></html>
